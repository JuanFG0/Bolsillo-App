<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bolsillo</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bolsillo">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="theme-color" content="#F2F2F7">
  <meta name="description" content="Control de gastos, ingresos y deudas. Funciona sin internet.">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- Aplica el tema antes de pintar para que no haya parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('bolsillo-theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var m = document.getElementById('theme-color');
        if (m) m.setAttribute('content', dark ? '#000000' : '#F2F2F7');
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <div class="dock" id="dock"></div>
  </div>

  <div id="layers"></div>
  <div id="lock" hidden></div>

  <!-- Animación de apertura -->
  <div id="splash" aria-hidden="true">
    <div class="splash-mark">
      <svg viewBox="0 0 120 120" width="132" height="132" focusable="false">
        <circle class="ring-track" cx="60" cy="60" r="50"></circle>
        <circle class="ring" cx="60" cy="60" r="50" pathLength="100"></circle>
        <text class="sign" x="60" y="79" text-anchor="middle">$</text>
      </svg>
    </div>
    <div class="splash-name">Bolsillo</div>
  </div>

  <noscript>Bolsillo necesita JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
